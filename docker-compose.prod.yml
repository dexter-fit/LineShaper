services:
  line-shaper-proxy-server:
    container_name: line-shaper-proxy-server
    image: nginx:stable-alpine
    depends_on:
      line-shaper-api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/home/index.html:ro
      - ./router/src/favicon.ico:/home/favicon.ico:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - line-shaper-network
      - edge
  line-shaper-map-editor:
    container_name: line-shaper-map-editor
    image: dexter.fit.vutbr.cz/line-shaper/line-shaper-editor:latest
    depends_on:
      line-shaper-db:
        condition: service_healthy
    environment:
      TZ: "Europe/Bratislava"
      EDITOR_AUTH: false
      NO_DOWNLOAD: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - line-shaper-network
  line-shaper-line-router:
    container_name: line-shaper-line-router
    image: dexter.fit.vutbr.cz/line-shaper/line-shaper-router:latest
    depends_on:
      line-shaper-db:
        condition: service_healthy
    environment:
      TZ: "Europe/Bratislava"
      NO_DOWNLOAD: true
      ROUTER_AUTH: false
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - line-shaper-network
  line-shaper-api:
    container_name: line-shaper-api
    image: dexter.fit.vutbr.cz/line-shaper/line-shaper-api:latest
    depends_on:
      line-shaper-db:
        condition: service_healthy
    environment:
      TZ: "Europe/Bratislava"
      EDITOR_AUTH: false
      ROUTER_AUTH: false
      NO_DOWNLOAD: true
    env_file:
      - api/.env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:9004/lineShaper/api/mapStats/').then(r => process.exit(r.status === 401 || r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - line-shaper-network
  line-shaper-db:
    container_name: line-shaper-db
    image: postgis/postgis:16-3.7
    volumes:
      - ./api/initDB.sql:/docker-entrypoint-initdb.d/initDB.sql
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      PGUSER: ${DB_USER}
      TZ: "Europe/Bratislava"
    env_file:
      - api/.env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DB_DATABASE} -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - line-shaper-network
networks:
  line-shaper-network:
    name: line-shaper-network
  edge:
    name: line-shaper-edge
